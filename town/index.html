<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Trading 小镇 · 交易团队</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title">TRADING 小镇 <span class="sub">交易团队 · Trading Town</span></div>
  <div class="banner">只读看板 · 本页不连接交易所、不含任何 Key、不下单 · 数据来自团队日志与账户快照</div>
  <div class="clock" id="clock">—</div>
</header>
<main>
  <section class="stage">
    <canvas id="town" width="1280" height="720"></canvas>
    <div class="legend">点击建筑查看详情 · 点击动态条目回放该真实事件 · 数据每 <span id="refreshSec">30</span> 秒刷新<span id="dataGen"></span></div>
    <section class="rantwall" id="rantwall"><h3>☕ 摸鱼角 · 吐槽墙 <span class="muted">纯属玩笑 · bot 们的打工自述 · <span id="rantMeta"></span></span></h3><div class="rants" id="rants"></div></section>
  </section>
  <aside>
    <div class="srcbar"><button id="srcToggle" type="button">显示数据来源</button><span class="muted">悬停或点击任一行也可查看该数字的来源与更新时间</span></div>
    <div class="panel" id="panel-us"></div>
    <div class="panel" id="panel-crypto"></div>
    <div class="panel" id="panel-detail"><h3>建筑详情</h3><div class="muted">点击小镇中的建筑</div></div>
  </aside>
</main>
<section class="feedwrap">
  <h3>实时动态 LIVE FEED <span class="muted" id="feedMeta"></span></h3>
  <ul id="feed"></ul>
</section>
<script src="town.js"></script>
</body>
</html>
